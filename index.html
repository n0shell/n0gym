  <!-- Aviso de arranque: si la app no llega a pintarse, explica qué falla y permite limpiar la caché
       (no toca los datos: IndexedDB y localStorage se conservan). -->
  <script>
    (function () {
      var failed = [];
      var errors = [];
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) failed.push(el.getAttribute('src') || el.getAttribute('href'));
        else if (e.message) errors.push(e.message);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        errors.push(String((e.reason && e.reason.message) || e.reason));
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          var main = document.getElementById('main');
          if (!main || main.querySelector('.top, .banner, .card, .empty, .brand, h1')) return;
          var es = /^es/i.test(navigator.language || '');
          var box = document.createElement('div');
          box.style.cssText = 'padding:16px;border:1px solid #ff7d70;border-radius:14px;background:#141612;color:#eef1e8;margin-top:16px';
          var title = document.createElement('p');
          title.style.fontWeight = '700';
          title.textContent = es ? 'n0gym no ha podido arrancar' : 'n0gym could not start';
          var detail = document.createElement('p');
          detail.style.cssText = 'color:#a0a796;font-size:.9rem;overflow-wrap:anywhere;margin:8px 0 12px';
          detail.textContent = (failed.length ? (es ? 'No se cargaron: ' : 'Failed to load: ') + failed.join(', ') + '. ' : '') + (errors.length ? 'Error: ' + errors[0] : '');
          var button = document.createElement('button');
          button.type = 'button';
          button.style.cssText = 'min-height:48px;padding:0 20px;border:0;border-radius:12px;background:#c6f432;color:#101500;font:inherit;font-weight:700';
          button.textContent = es ? 'Limpiar caché y recargar (tus datos se conservan)' : 'Clear cache and reload (your data is kept)';
          button.onclick = function () {
            var jobs = [];
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (list) {
                return Promise.all(list.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches) {
              jobs.push(caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); }));
            }
            Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
          };
          box.appendChild(title);
          box.appendChild(detail);
          box.appendChild(button);
          main.appendChild(box);
        }, 2500);
      });
    })();
  </script>
